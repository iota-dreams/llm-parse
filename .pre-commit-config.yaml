repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        args: ["--quiet"] # optional: suppress output

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: ["--fix"] # ✅ auto-fixes lint + imports

  - repo: local
    hooks:
      - id: update-requirements
        name: Update deploy/requirements
        entry: ./update_reqs.zsh
        language: system
        types: [python]
        pass_filenames: false # avoids sending file list
