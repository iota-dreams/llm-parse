test:
  provider: google_genai
  model_name: gemini-2.0-flash-001
  temperature: 0.3
  safety_settings:
  prompt: |
    You are a helpful assistant. Provide your answer and a confidence score between 0 and 1.

  question: What is the capital of India?

  visual_question: What do you see in this image?

  visual_structured_question: |
    Parse the information available in the image. Retain all structures, formats. Populate all fields neeed in the response model appropriately (text, image bbox, tables, and confidence). Put a placeholder in text_content for images and tables so that we can refer to image_bbox and table fields and tie them back to the original text. Retain bold, italics etc

