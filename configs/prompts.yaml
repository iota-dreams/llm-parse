parser:
  provider: google_genai
  model_name: gemini-2.0-flash-001
  temperature: 0.3
  prompt: |
    You are an intelligent document parser.

    Given a visual document page (image), extract the meaningful content and return it in a structured **JSON object** conforming to the following schema:

    ---

    **Schema:**

    - `text_content`: A string containing the clean, structured text extracted from the page.
      - Replace any tables or visual elements with placeholders like `{{table_1}}`, `{{image_1}}`, with double `{{}}` etc.

    - `tables`: A JSON object (dictionary) of extracted tables.
      - Each key must match a placeholder in `text_content`, e.g., `"table_1"`.
      - Each value must be the table content as a **{table_format}** string (either `"markdown"` or `"html"`).
      - ⚠️ Must be a valid JSON dictionary — not a stringified dictionary.
      - Use **double quotes** for all keys and string values.
      - Escape all newlines in the table string using `\\n`.
      - Do **not** use single quotes, ellipses (`...`), or trailing commas.

    - `image_bbox`: A JSON object mapping visual elements (e.g., charts, diagrams, figures).
      - Each key must match an image placeholder in `text_content`, such as `"image_1"`.
      - Each value should be a bounding box in the format `[x_min, y_min, x_max, y_max]`.
      - Bounding box coordinates must be **normalized to the range [0.0, 1.0]** relative to the image/page dimensions:
        - `(0.0, 0.0)` represents the top-left corner
        - `(1.0, 1.0)` represents the bottom-right corner

    - `parse_confidence`: A float between 0 and 1 indicating your confidence in the parsing.

    ---

    📎 **Image Bounding Box Guide**

    Here is a dictionary of potential visual element locations extracted via PyMuPDF:  
    **`image_bbox_guide`** = `{image_bbox_guide}`

    - Each value is a normalized bounding box: `[x_min, y_min, x_max, y_max]`, in the range `[0.0, 1.0]`.
    - You may:
      - Use the bounding boxes as-is,
      - Adjust them to better match actual content,
      - Discard incorrect ones,
      - Or add new bounding boxes as needed.
    - If `text_content` contains placeholders like `{{image_1}}`, align them with the correct bounding box.

    ---

    ⚠️ **Important:**

    - Return **only** a valid JSON object conforming exactly to this schema.
    - Do **not** wrap dictionaries in strings or return explanations.
    - Do **not** use Python-style syntax (e.g., single quotes, unquoted keys).
    - Do **not** include Markdown fencing such as ````json```.
    - Use **double quotes** for all keys and string values.

    ---

    Now parse the following document page.

