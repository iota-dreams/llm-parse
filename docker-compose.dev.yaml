version: "3.8"

services:
  llm-parse-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dev
    container_name: llm-parse-api-dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app:cached
      - ./logs:/app/logs
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      CONFIG_ROOT: configs
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
