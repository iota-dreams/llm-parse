version: "3.8"

services:
  llm-parse-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: llm-parse-api-prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      CONFIG_ROOT: configs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3
